<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма отклика</title>
  <link rel="stylesheet" href="/form/form.css">
</head>
<body>
  <main class="form-page">
    <div id="loading" class="state">Загружаем форму…</div>
    <div id="unavailable" class="state" hidden>
      <h1>Форма недоступна</h1>
      <p id="unavailable-reason">Возможно, ссылка устарела или форма ещё не опубликована.</p>
    </div>

    <div id="form-wrap" hidden>
      <header class="form-head">
        <h1 id="form-title"></h1>
        <p id="form-desc" class="form-desc"></p>
      </header>

      <form id="response-form" novalidate></form>

      <div id="success" class="state state--success" hidden>
        <h1>Спасибо!</h1>
        <p>Ответ отправлен. Мы свяжемся с вами, если подойдём под требования.</p>
      </div>
    </div>
  </main>

  <script src="/form/form.js"></script>
</body>
</html>
